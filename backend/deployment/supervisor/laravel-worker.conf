[program:laravel-worker]
# Laravel Queue Worker Configuration for Vriddhi API
# Manages background job processing for emails, notifications, and async tasks

# Process configuration
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/vriddhi-api/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

# Number of worker processes
numprocs=2

# User and group
user=deploy
group=deploy

# Priority
priority=999

# Logging
stdout_logfile=/var/www/vriddhi-api/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/www/vriddhi-api/storage/logs/worker-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

# Restart policy
# Restart if worker exits unexpectedly
startsecs=10
startretries=3

# Stop timeout (graceful shutdown)
stopwaitsecs=60

# Environment variables (optional - can also use .env file)
# environment=APP_ENV="production"
